server {
    listen 3000;
    server_name _;
    server_tokens off;
    charset utf-8;

    # This server runs behind the public nginx proxy, so it must never emit an
    # absolute redirect: it would leak this internal port (:3000) into the
    # Location header and break the link for the visitor.
    absolute_redirect off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Resolve pre-rendered pages (/privacy -> /privacy/index.html) directly
        # instead of going through a directory redirect, then fall back to the
        # SPA shell for client-side routes.
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}
