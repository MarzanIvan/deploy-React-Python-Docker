x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  dev:

services:
  # Публичный веб-сервер. TLS-сертификаты Let's Encrypt Caddy выпускает и
  # продлевает автоматически — certbot больше не используется.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - dev
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    mem_reservation: 32m
    stop_grace_period: 30s
    logging: *default-logging

  # Реестр согласий пользователей (152-ФЗ). Порт наружу не публикуется.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: videovault
      POSTGRES_USER: videovault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videovault -d videovault"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 64m
    stop_grace_period: 30s
    logging: *default-logging

  backend:
    build:
      context: ./backend
    init: true
    environment:
      DATABASE_URL: postgresql://videovault:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/videovault
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:?REGISTRY_PASSWORD must be set in .env}
    # Мягкая зависимость: реестр подключается к БД лениво, поэтому скачивание
    # видео продолжает работать, даже если база временно недоступна.
    depends_on:
      db:
        condition: service_started
    networks:
      - dev
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./downloads:/root/Downloads
      - ./cookies.txt:/cookies.txt
    mem_limit: 1400m
    mem_reservation: 256m
    restart: unless-stopped
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/queue_status/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    networks:
      - dev
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    mem_reservation: 32m
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
